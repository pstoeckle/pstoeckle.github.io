name: "Build page with jekyll"

on: { push: { branches: [main] } }
permissions: {}
concurrency:
  group: "build-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build site with Jekyll
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pstoeckle/pstoeckle.github.io/devcontainer:2026.08.03@sha256:beadd709be934c0008b81634f3242e40196eec6248d31334dbce3cfa1c723e43
      options: --user 1001:1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Cache bundle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: _vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Build site with Jekyll
        run: |-
          set -eu

          /home/vscode/.rbenv/shims/bundle install
          /home/vscode/.rbenv/shims/bundle exec jekyll build
