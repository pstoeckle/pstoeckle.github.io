name: "Build page with jekyll"

on: { push: { branches: [main] } }
permissions: {}
concurrency:
  group: "build-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build site with Jekyll
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pstoeckle/pstoeckle.github.io/devcontainer:2026.11.04@sha256:f678749f5a43c2ba2c0b7803bf3ca47c0b0f7830c8a3dd58e7ef285b99fd4c20
      options: --user 1001:1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Cache bundle dependencies
        uses: actions/cache@v6.1.0
        with:
          path: _vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Build site with Jekyll
        run: |-
          set -eu

          /home/vscode/.rbenv/shims/bundle install
          /home/vscode/.rbenv/shims/bundle exec jekyll build
