name: "Build page with jekyll and node and deploy to GitHub pages."

on: { release: { types: [published] } }
concurrency:
  group: "deploy-pages"
  cancel-in-progress: true
permissions: {}

jobs:
  deploy:
    name: Build site with Jekyll and Node and deploy to GitHub Pages
    permissions:
      contents: read
      pages: write # Required to deploy to GitHub Pages
      id-token: write # Required to authenticate with the GitHub Pages deployment API
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pstoeckle/pstoeckle.github.io/devcontainer:2026.11.04@sha256:f678749f5a43c2ba2c0b7803bf3ca47c0b0f7830c8a3dd58e7ef285b99fd4c20
      options: --user 1001:1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Build site with Jekyll and Node
        env:
          CURRENT_VERSION: ${{ github.ref_name }}
        run: |-
          set -eu
          /home/vscode/.rbenv/shims/bundle install
          /home/vscode/.rbenv/shims/bundle exec jekyll build --baseurl pstoeckle.github.io
          rm _site/*.json
          rm _site/*.md
          rm _site/CODEOWNERS
          rm _site/Makefile
          npm ci
          node build.js
          ./node_modules/.bin/replace-in-file VERSION_PLACEHOLDER ${CURRENT_VERSION} _site/index.html
          ./node_modules/.bin/replace-in-file VERSION_PLACEHOLDER ${CURRENT_VERSION} _site/publications.html
          ./node_modules/.bin/replace-in-file VERSION_PLACEHOLDER ${CURRENT_VERSION} _site/talks.html
          ./node_modules/.bin/replace-in-file VERSION_PLACEHOLDER ${CURRENT_VERSION} _site/teaching.html
      # Upload pages needs
      # - files to have read permission for the current user and the "Others" user role (e.g. 0744, 0644, 0444)
      # - directories to have read and execute permissions for the current user and the "Others" user role (e.g. 0755, 0555)
      - name: Fix permissions
        run: |-
          chmod -v -R +rX "_site/"
      - name: Upload pages
        uses: actions/upload-pages-artifact@v5.0.0
      - name: Deploy pages
        uses: actions/deploy-pages@v5.0.1
