name: Build and push devcontainer image

on:
  push:
    tags:
      - devcontainer-*
concurrency:
  group: "build-and-push-devcontainer-image"
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-push:
    permissions:
      packages: write # Required to push to GitHub Container Registry
      contents: write # Required to update workflow/devcontainer image references
    name: Build and push devcontainer image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |-
          set -eu
          version="${GITHUB_REF_NAME#devcontainer-}"
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          echo "value=ghcr.io/${owner}/${repo}/devcontainer:${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-arch devcontainer image
        run: |-
          set -eu
          npx -y @devcontainers/cli build \
            --config .devcontainer/build/devcontainer.json \
            --image-name "${STEPS_IMAGE_OUTPUTS_VALUE}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --platform linux/amd64,linux/arm64 \
            --push \
            --workspace-folder .
        env:
          STEPS_IMAGE_OUTPUTS_VALUE: ${{ steps.image.outputs.value }}

      - name: Resolve pushed image digest
        id: digest
        run: |-
          set -eu
          digest="$(docker buildx imagetools inspect "${STEPS_IMAGE_OUTPUTS_VALUE}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          [ -n "${digest}" ]
          echo "value=${digest}" >> "${GITHUB_OUTPUT}"
        env:
          STEPS_IMAGE_OUTPUTS_VALUE: ${{ steps.image.outputs.value }}

      - name: Update image references
        run: |-
          set -eu

          default_branch="${GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH}"
          git fetch --no-tags origin "${default_branch}"
          git checkout -B "${default_branch}" "origin/${default_branch}"

          image_ref="${STEPS_IMAGE_OUTPUTS_VALUE}@${STEPS_DIGEST_OUTPUTS_VALUE}"

          if ! grep -Fq "${image_ref}" .github/workflows/build-only.yml; then
            echo "::warning file=.github/workflows/build-only.yml::Manual update required: set container image to ${image_ref}."
          fi
          if ! grep -Fq "${image_ref}" .github/workflows/gh-pages.yml; then
            echo "::warning file=.github/workflows/gh-pages.yml::Manual update required: set container image to ${image_ref}."
          fi

          sed -E -i "s|^(\s*\"image\"\s*:\s*\").*(\",\s*)$|\\1${image_ref}\\2|" .devcontainer/devcontainer.json

          if git diff --quiet -- .devcontainer/devcontainer.json; then
            echo "No image reference changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .devcontainer/devcontainer.json
          git commit -m ":wrench: chore(devcontainer): update devcontainer image references to ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${default_branch}"
        env:
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STEPS_IMAGE_OUTPUTS_VALUE: ${{ steps.image.outputs.value }}
          STEPS_DIGEST_OUTPUTS_VALUE: ${{ steps.digest.outputs.value }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
